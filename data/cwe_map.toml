# ------------------------------------------------------------------ cppcheck
# cppcheck emits CWE ids itself, so these rules exist only to *override* a
# native id Kordon considers wrong or too coarse. Everything else flows through
# with cwe_source = native.
#
# The overrides are not cosmetic. cppcheck routinely reports the *parent* CWE:
# `operatorEqToSelf` and `containerOutOfBounds` both come back as CWE-398
# ("Indicator of Poor Code Quality"), and `deallocret` as CWE-672. Taking those
# at face value silently drops real 416/119 findings out of the in-scope report.
# This list was validated empirically against a large C++ codebase before being
# ported here; do not trim it without re-checking against real tool output.

# Bounds
[[rule]]
tool = "cppcheck"
check = "containerOutOfBounds"
cwe = 119
confidence = "high"

[[rule]]
tool = "cppcheck"
check = "arrayIndexOutOfBounds"
cwe = 788
confidence = "high"

[[rule]]
tool = "cppcheck"
check = "arrayIndexOutOfBoundsCond"
cwe = 788
confidence = "medium"

[[rule]]
tool = "cppcheck"
check = "bufferAccessOutOfBounds"
cwe = 119
confidence = "high"

[[rule]]
tool = "cppcheck"
check = "pointerOutOfBounds"
cwe = 119
confidence = "high"

[[rule]]
tool = "cppcheck"
