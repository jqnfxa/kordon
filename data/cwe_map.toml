# ------------------------------------------------- Kordon's own AST matchers
# Checks with no off-the-shelf equivalent, run through clang-query. Always low
# confidence: an AST matcher sees shape, and for these classes intent is what
# decides whether the shape is a defect.

# CWE-191. No other engine Kordon drives detects this class at all -- verified
# against cppcheck exhaustive, clang-tidy, Clang SA with alpha.core, and both
# compilers' warning sets, none of which flag even a constant
# `size_t n = 0; return n - 1;`. Unsigned wraparound is well-defined C++, so
# there is nothing for them to call erroneous. Only clang's opt-in
# -fsanitize=unsigned-integer-overflow reports it, and only at runtime.
[[rule]]
tool = "kordon-query"
check = "kordon-unsigned-subtraction"
cwe = 191
confidence = "low"

# CWE-190. Mirror of the subtraction check above and unreachable for the same
# reason. Multiplication was measured and deliberately excluded: flagging every
# unsigned `*` cost 1228 extra matches to gain one defect.
#
# Specificity caveat, measured: on a corrected copy of the reference corpus this
# check reports the fixed code identically to the broken code. The fix idiom
# there is a precondition validated with an early throw --
# `if (roi.left() > roi.right()) ACL_THROW(...);` before `right() - left() + 1`
# -- which no AST matcher can see. Treat CWE-190 findings as "this expression
# can overflow if unvalidated", not as "this is unvalidated".
[[rule]]
tool = "kordon-query"
check = "kordon-unsigned-addition"
cwe = 190
confidence = "low"

# CWE-401 at the cause rather than the symptom. A class that releases a raw
# owning pointer only when a bool member permits it can leak on any path that
# leaves the flag unset, and double-free on copy (hence CWE-415 as well). On the
# reference corpus this reports 5 class-level sites against 66 recorded leak
# positions -- the 66 are consequences in unrelated functions that merely held
# such an object as a local. Verified to go silent on the corrected tree, where
# the flag was replaced by a member smart pointer.
[[rule]]
tool = "kordon-query"
check = "kordon-manual-ownership-flag"
cwe = 401
confidence = "low"

