# -------------------------------------------- clang-tidy: cppcoreguidelines-*
# Mostly risk patterns, not proven defects -- hence `low` confidence.

# C.21 / Rule of Five. An owning class without explicit copy control gets a
# compiler-generated shallow copy -> two owners of one pointer -> double free.
# Latent, not observed: low confidence by construction. See CLAUDE.md.
