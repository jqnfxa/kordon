# Kordon curated tool-check -> CWE mapping table.
#
# Two sections:
#   [[cwe]]   catalog: id -> human name + Kordon scope tier.
#             tier 1 = in scope (generic memory/value-safety). See CLAUDE.md.
#             tier 2 = injection/taint class, explicitly out of scope.
#             tier 3 = authorization / web-specific, explicitly out of scope.
#             tier 0 = style / code-quality indicators, not a defect class we claim.
#
#   [[rule]]  tool + native check id -> CWE.
#             `message_contains` discriminates checks that cover several defect
#             classes under one id (clang-analyzer-unix.Malloc is leak AND
#             use-after-free AND double-free). Rules carrying `message_contains`
#             are tried before the bare fallback rule for the same check.
#
#             `confidence` overrides the per-tool default. Use `low` when the
#             check flags a *risk pattern* rather than a proven defect --
#             cppcoreguidelines-special-member-functions is the canonical case:
#             a missing copy ctor on an owning class is a latent double-free,
#             not an observed one.

