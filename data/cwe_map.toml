# Resolved, having been an open question since the first session. The reference
# codebase does `x = new bbf_data;` then `free(x)`. Both classes describe it:
# 762 is the precise one ("a release function not compatible with the function
# originally used to allocate"), while 763 is broader and covers calling the
# wrong release function as well. Requirements lists in this domain name 763,
