# ---------------------------------------- clang-tidy gaps found by running it
# Every entry here was an unmapped finding on a real project first. The style
# ones are given a tier-0 CWE deliberately: an unmapped finding means "nobody
# has classified this", and leaving a decision recorded as an open question is
# how the gap list stops being useful.

# Multiplication done in a narrow type and widened afterwards -- the overflow
# has already happened. This was in the prior work's table and was missed when
# porting it; 83 findings on one corpus.
[[rule]]
tool = "clang-tidy"
check = "bugprone-implicit-widening-of-multiplication-result"
cwe = 190
confidence = "medium"

# operator= that does not guard against self-assignment frees the source before
# copying it. Real class, unreliable check: it recognises only the
# `if (this != &other)` idiom, so a pimpl class guarding with
# `if (d == other.d) return *this;` -- which is equally correct -- is reported
# anyway. Measured on the reference corpus: 6 of its 15 findings are guarded
# code, including the one position the maintainers had already dismissed as a
# false positive. Low confidence, and do not promote it.
[[rule]]
tool = "clang-tidy"
check = "bugprone-unhandled-self-assignment"
cwe = 415
confidence = "low"

