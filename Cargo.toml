[package]
name = "kordon"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "Static+dynamic analysis orchestrator for C/C++, producing one CWE-mapped report"
repository = "https://github.com/jqnfxa/kordon"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

[profile.release]
strip = true
